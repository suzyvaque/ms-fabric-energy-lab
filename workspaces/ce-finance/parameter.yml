# fabric-cicd parameterization for the ce-finance workspace (dev -> prod). Environment key = PROD.
# Fabric Git stores real dev IDs; rebind them to prod items at deploy time (no GUIDs written here).
find_replace:
  # Notebook default lakehouse -> prod lh_finance in the prod workspace
  - find_value: \#\s*META\s+"default_lakehouse":\s*"([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})"
    replace_value:
      PROD: "$items.Lakehouse.lh_finance.$id"
    is_regex: "true"
    item_type: "Notebook"
  - find_value: \#\s*META\s+"default_lakehouse_workspace_id":\s*"([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})"
    replace_value:
      PROD: "$workspace.$id"
    is_regex: "true"
    item_type: "Notebook"
  # Direct Lake semantic model -> prod lh_finance SQL analytics endpoint (host, then endpoint id)
  - find_value: Sql\.Database\("([^"]+)",\s*"[0-9a-fA-F-]{36}"\)
    replace_value:
      PROD: "$items.Lakehouse.lh_finance.$sqlendpoint"
    is_regex: "true"
    item_type: "SemanticModel"
  - find_value: Sql\.Database\("[^"]+",\s*"([0-9a-fA-F-]{36})"\)
    replace_value:
      PROD: "$items.Lakehouse.lh_finance.$sqlendpointid"
    is_regex: "true"
    item_type: "SemanticModel"

key_value_replace:
  # Bronze shortcuts -> prod mirrored database (same workspace)
  - find_key: $[?(@.target.oneLake.artifactType=="MountedRelationalDatabase")].target.oneLake.itemId
    replace_value:
      PROD: "$items.MirroredDatabase.mir_loan_servicing.$id"
    item_type: "Lakehouse"
    item_name: "lh_finance"
  - find_key: $[?(@.target.oneLake.artifactType=="MountedRelationalDatabase")].target.oneLake.workspaceId
    replace_value:
      PROD: "$workspace.$id"
    item_type: "Lakehouse"
    item_name: "lh_finance"
  # Cross-domain shortcut -> prod Asset data product (deployed earlier in the same run)
  - find_key: $[?(@.name=="ref_sites")].target.oneLake.workspaceId
    replace_value:
      PROD: "$workspace.ce-asset-prod.$id"
    item_type: "Lakehouse"
    item_name: "lh_finance"
  - find_key: $[?(@.name=="ref_sites")].target.oneLake.itemId
    replace_value:
      PROD: "$workspace.ce-asset-prod.$items.Lakehouse.lh_asset.$id"
    item_type: "Lakehouse"
    item_name: "lh_finance"
  # GraphQL API -> prod lh_finance SQL analytics endpoint
  - find_key: $.datasources[*].sourceItemId
    replace_value:
      PROD: "$items.Lakehouse.lh_finance.$sqlendpointid"
    item_type: "GraphQLApi"
  - find_key: $.datasources[*].sourceWorkspaceId
    replace_value:
      PROD: "$workspace.$id"
    item_type: "GraphQLApi"
  # Data agent source -> prod lh_finance
  - find_key: $.artifactId
    replace_value:
      PROD: "$items.Lakehouse.lh_finance.$id"
    item_type: "DataAgent"
    item_name: "da_finance"
    file_path: "**/lakehouse-tables-lh_finance/datasource.json"
  - find_key: $.workspaceId
    replace_value:
      PROD: "$workspace.$id"
    item_type: "DataAgent"
    item_name: "da_finance"
    file_path: "**/lakehouse-tables-lh_finance/datasource.json"
  # Step 7: pipeline Notebook activity -> prod nb_finance_medallion in the prod workspace
  - find_key: $.properties.activities[?(@.type=="TridentNotebook")].typeProperties.notebookId
    replace_value:
      PROD: "$items.Notebook.nb_finance_medallion.$id"
    item_type: "DataPipeline"
    item_name: "pl_finance_daily"
  - find_key: $.properties.activities[?(@.type=="TridentNotebook")].typeProperties.workspaceId
    replace_value:
      PROD: "$workspace.$id"
    item_type: "DataPipeline"
    item_name: "pl_finance_daily"
