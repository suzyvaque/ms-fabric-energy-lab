# Step 8: prove OneLake security (RLS/CLS + shortcut security) as a restricted principal.
# The deploy service principal signs in with OIDC (no secret) and queries the DEV workspaces, where it is only a
# Viewer + member of FinanceViewerNoPII (py infra/governance.py roles --env dev --test-principal).
name: governance-test
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  onelake-security:
    runs-on: ubuntu-latest
    environment: prod   # the federated credential subject; the job only reads dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r infra/requirements.txt
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Enforcement checks
        run: python infra/governance_test.py
      - name: Access matrix probes (step 10, obs lab, as the deploy SP = Viewer, NOT a role member)
        if: always()
        run: pip install openai && python infra/access_matrix.py run --as deploy-sp --profile obs
      - name: Upload probes (no IDs/accounts; 1 day)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-probes-sp
          path: infra/.state/access_probes.jsonl
          retention-days: 1
